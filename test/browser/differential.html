          ["i32 maximum plus one", 2_147_483_648],
          ["i32 minimum", -2_147_483_648],
          ["i32 minimum minus one", -2_147_483_649],
          ["u32 maximum", 4_294_967_295],
          ["u32 modulus", 4_294_967_296],
          ["null", null],
          ["true", true],
          ["false", false],
          ["numeric string", "42"],
          ["fraction string", "-1.9"],
          ["empty string", ""],
          ["non-numeric string", "opencv"],
          ["explicit undefined", undefined],
        ];
        const booleanCases = [
          ["true", true],
          ["false", false],
          ["zero", 0],
          ["one", 1],
          ["negative one", -1],
          ["two", 2],
          ["NaN", Number.NaN],
          ["positive infinity", Number.POSITIVE_INFINITY],
          ["negative infinity", Number.NEGATIVE_INFINITY],
          ["null", null],
          ["empty string", ""],
          ["zero string", "0"],
          ["false string", "false"],
          ["non-empty string", "opencv"],
          ["object", {}],
          ["explicit undefined", undefined],
        ];

        const defaultsDetector = createDetector();
        const defaults = Object.fromEntries(
          getters.map((method) => [method, captureCall(() => defaultsDetector[method]())]),
        );
        safeDelete(defaultsDetector);

        const getterArity = getters.map((method) => {
          const detector = createDetector();
          const audit = {
            method,
            length: detector[method].length,
            exact: captureCall(() => detector[method]()),
            extraOne: captureCall(() => detector[method](1)),
            stateAfterExtraOne: captureCall(() => detector[method]()),
            extraTwo: captureCall(() => detector[method](1, 2)),
            stateAfterExtraTwo: captureCall(() => detector[method]()),
          };
          safeDelete(detector);
          return audit;
        });
        const setterArity = setters.map(([method, getter, value]) => {
          const lengthDetector = createDetector();
          const length = lengthDetector[method].length;
          safeDelete(lengthDetector);
          const exactDetector = createDetector();
          const exact = captureCall(() => exactDetector[method](value));
          const stateAfterExact = captureCall(() => exactDetector[getter]());
          safeDelete(exactDetector);

          const auditFailure = (invoke) => {
            const detector = createDetector();
            const stateBefore = captureCall(() => detector[getter]());
            const call = captureCall(() => invoke(detector, method, value));
            const stateAfter = captureCall(() => detector[getter]());
            safeDelete(detector);
            return { stateBefore, call, stateAfter };
          };

          return {
            method,
            length,
            exact,
            stateAfterExact,
            missing: auditFailure((detector, setter) => detector[setter]()),
            extraOne: auditFailure((detector, setter, argument) => detector[setter](argument, 1)),
            extraTwo: auditFailure((detector, setter, argument) =>
              detector[setter](argument, 1, 2),
            ),
          };
        });

        const deadDetector = createDetector();
        const firstDelete = captureCall(() => deadDetector.delete());
        const postDelete = {
          getters: getters.map((method) => ({
            method,
            call: captureCall(() => deadDetector[method]()),
          })),
          setters: setters.map(([method, , value]) => ({
            method,
            call: captureCall(() => deadDetector[method](value)),
          })),
          secondDelete: captureCall(() => deadDetector.delete()),
        };

        const auditDeleteExtra = (...arguments_) => {
          const detector = createDetector();
          const stateBefore = captureCall(() => detector.getThreshold());
          const call = captureCall(() => detector.delete(...arguments_));
          const stateAfter = captureCall(() => detector.getThreshold());
          safeDelete(detector);
          return { stateBefore, call, stateAfter };
        };
        const deleteLengthDetector = createDetector();
        const deleteLength = captureCall(() => deleteLengthDetector.delete.length);
        safeDelete(deleteLengthDetector);

        return {
          defaults,
          arity: { getters: getterArity, setters: setterArity },
          i32: auditSetterCases(createDetector, "setThreshold", "getThreshold", i32Cases),
          boolean: auditSetterCases(
            createDetector,
            "setNonmaxSuppression",
            "getNonmaxSuppression",
            booleanCases,
          ),
          lifetime: {
            deleteLength,
            firstDelete,
            postDelete,
            deleteExtraOne: auditDeleteExtra(1),
            deleteExtraTwo: auditDeleteExtra(1, 2),
          },
        };
      }

      function findDifference(actual, expected, path = "GFTT audit") {
        if (Object.is(actual, expected)) {
          return undefined;
        }
        if (typeof actual !== typeof expected || actual === null || expected === null) {
          return `${path}: package=${JSON.stringify(actual)} OpenCV.js=${JSON.stringify(expected)}`;
        }
        if (typeof actual !== "object") {
          return `${path}: package=${JSON.stringify(actual)} OpenCV.js=${JSON.stringify(expected)}`;
        }
        if (Array.isArray(actual) !== Array.isArray(expected)) {
          return `${path}: package and OpenCV.js have different container types`;
        }
        if (Array.isArray(actual)) {
          if (actual.length !== expected.length) {
            return `${path}.length: package=${actual.length} OpenCV.js=${expected.length}`;
          }
          for (let index = 0; index < actual.length; index += 1) {
            const difference = findDifference(actual[index], expected[index], `${path}[${index}]`);
            if (difference !== undefined) {
              return difference;
            }
          }
          return undefined;
        }
        const actualKeys = Object.keys(actual).sort();
        const expectedKeys = Object.keys(expected).sort();
        const keyDifference = findDifference(actualKeys, expectedKeys, `${path} keys`);
        if (keyDifference !== undefined) {
          return keyDifference;
        }
        for (const key of actualKeys) {
          const difference = findDifference(actual[key], expected[key], `${path}.${key}`);
          if (difference !== undefined) {
            return difference;
          }
        }
        return undefined;
      }

      function normalizeCountNonZeroAudit(audit) {
        return {
          ...audit,
          multiChannel: audit.multiChannel.map((entry) => ({
            ...entry,
            call: { threw: entry.call.threw },
          })),
        };
      }

      function normalizeRepeatAudit(audit) {
        const unstableInvalidCountLabels = new Set([
          "negative two",
          "negative fraction",
          "negative subunit fraction",
          "negative zero",
          "zero",
          "positive subunit fraction",
          "i32 maximum",
          "i32 minimum",
          "NaN",
          "false",
        ]);
        return {
          ...audit,
          counts: audit.counts.map((entry) =>
            unstableInvalidCountLabels.has(entry.label)
              ? {
                  ...entry,
                  audit: {
                    ...entry.audit,
                    call: { threw: entry.audit.call.threw },
                  },
                }
              : entry,
          ),
          inPlace: {
            ...audit.inPlace,
            call: { threw: audit.inPlace.call.threw },
          },
        };
      }

      function normalizeRotateAudit(audit) {
        return {
          ...audit,
          codes: audit.codes.map((entry) =>
            entry.nativeInvalid
              ? {
                  ...entry,
                  audit: {
                    ...entry.audit,
                    call: { threw: entry.audit.call.threw },
                  },
                }
              : entry,
          ),
        };
      }

      function runReference(input, referenceRequest) {
        return new Promise((resolve, reject) => {
          const worker = new Worker("/test/browser/opencv-reference-worker.js");
          const timeout = setTimeout(() => {
            worker.terminate();
            reject(new Error("OpenCV.js worker timed out after 180 seconds"));
          }, 180000);
          worker.addEventListener("message", ({ data }) => {
            if (data.progress !== undefined) {
              result.value = data.progress;
              return;
            }
            clearTimeout(timeout);
            worker.terminate();
            if (data.error !== undefined) {
              reject(new Error(data.error));
              return;
            }
            resolve(data.outputs);
          });
          worker.addEventListener("error", ({ message }) => {
            clearTimeout(timeout);
            worker.terminate();
            reject(new Error(message));
          });
          worker.postMessage(referenceRequest === undefined ? input : { input, referenceRequest });
        });
      }

      differential: try {
        const packageCv = await initOpenCv();
        const input = new Uint8Array([1, 2, 3, 4, 5, 6]);
        const packageSource = packageCv.matFromU8(2, 3, 1, input);
        const searchParameters = new URLSearchParams(globalThis.location.search);
        const referenceRequest = searchParameters.has("reference-transpose")
          ? "transpose"
          : searchParameters.has("reference-flip")
            ? "flip"
            : searchParameters.has("reference-repeat")
              ? "repeat"
              : searchParameters.has("reference-rotate")
                ? "rotate"
                : searchParameters.has("reference-count-non-zero")
                  ? "count-non-zero"
                  : undefined;
        const referenceOutputs = await runReference(input, referenceRequest);
        if (searchParameters.has("reference-transpose")) {
          packageSource.dispose();
          globalThis.transposeReferenceAudit = referenceOutputs.transposeAudit;
          result.style.whiteSpace = "pre-wrap";
          result.textContent = JSON.stringify(referenceOutputs.transposeAudit, null, 2);
          break differential;
        }
        if (searchParameters.has("reference-flip")) {
          packageSource.dispose();
          globalThis.flipReferenceAudit = referenceOutputs.flipAudit;
          result.style.whiteSpace = "pre-wrap";
          result.textContent = JSON.stringify(referenceOutputs.flipAudit, null, 2);
          break differential;
        }
        if (searchParameters.has("reference-repeat")) {
          packageSource.dispose();
          globalThis.repeatReferenceAudit = referenceOutputs.repeatAudit;
          result.style.whiteSpace = "pre-wrap";
          result.textContent = JSON.stringify(referenceOutputs.repeatAudit, null, 2);
          break differential;
        }
        if (searchParameters.has("reference-rotate")) {
          packageSource.dispose();
          globalThis.rotateReferenceAudit = referenceOutputs.rotateAudit;
          result.style.whiteSpace = "pre-wrap";
          result.textContent = JSON.stringify(referenceOutputs.rotateAudit, null, 2);
          break differential;
        }
        if (searchParameters.has("reference-count-non-zero")) {
          packageSource.dispose();
          globalThis.countNonZeroReferenceAudit = referenceOutputs.countNonZeroAudit;
          result.style.whiteSpace = "pre-wrap";
          result.textContent = JSON.stringify(referenceOutputs.countNonZeroAudit, null, 2);
          break differential;
        }
        const packageFlipAudit = auditPackageFlip(packageCv);
        const flipDifference = findDifference(
          packageFlipAudit,
          referenceOutputs.flipAudit,
          "flip audit",
        );
        if (flipDifference !== undefined) {
          throw new Error(flipDifference);
        }
        const packageRepeatAudit = auditPackageRepeat(packageCv);
        const repeatDifference = findDifference(
          normalizeRepeatAudit(packageRepeatAudit),
          normalizeRepeatAudit(referenceOutputs.repeatAudit),
          "repeat audit",
        );
        if (repeatDifference !== undefined) {
          throw new Error(repeatDifference);
        }
        const packageRotateAudit = auditPackageRotate(packageCv);
        const rotateDifference = findDifference(
          normalizeRotateAudit(packageRotateAudit),
          normalizeRotateAudit(referenceOutputs.rotateAudit),
          "rotate audit",
        );
        if (rotateDifference !== undefined) {
          throw new Error(rotateDifference);
        }
        const packageTransposeAudit = auditPackageTranspose(packageCv);
        const transposeDifference = findDifference(
          packageTransposeAudit,
          referenceOutputs.transposeAudit,
          "transpose audit",
        );
        if (transposeDifference !== undefined) {
          throw new Error(transposeDifference);
        }
        const packageCountNonZeroAudit = auditPackageCountNonZero(packageCv);
        const countNonZeroDifference = findDifference(
          normalizeCountNonZeroAudit(packageCountNonZeroAudit),
          normalizeCountNonZeroAudit(referenceOutputs.countNonZeroAudit),
          "countNonZero audit",
        );
        if (countNonZeroDifference !== undefined) {
          throw new Error(countNonZeroDifference);
        }
        if (searchParameters.has("reference-enums")) {
          packageSource.dispose();
          globalThis.detectorEnumReferenceAudit = referenceOutputs.detectorEnumAudit;
          result.style.whiteSpace = "pre-wrap";
          result.textContent = JSON.stringify(referenceOutputs.detectorEnumAudit, null, 2);
          break differential;
        }

        const packageDetectorEnumAudit = auditDetectorEnums({
          AKAZE: function PackageAKAZE() {
            return packageCv.createAKAZE();
          },
          AKAZE_DescriptorType: packageCv.AKAZE_DescriptorType,
          AgastFeatureDetector: function PackageAgastFeatureDetector() {
            return packageCv.createAgastFeatureDetector();
          },
          AgastFeatureDetector_DetectorType: packageCv.AgastFeatureDetector_DetectorType,
          FastFeatureDetector: function PackageFastFeatureDetector() {
            return packageCv.createFastFeatureDetector();
          },
          FastFeatureDetector_DetectorType: packageCv.FastFeatureDetector_DetectorType,
          KAZE: function PackageKAZE() {
            return packageCv.createKAZE();
          },
          KAZE_DiffusivityType: packageCv.KAZE_DiffusivityType,
        });
        const detectorEnumDifference = findDifference(
          packageDetectorEnumAudit,
          referenceOutputs.detectorEnumAudit,
          "detector enum audit",
        );
        if (detectorEnumDifference !== undefined) {
          throw new Error(detectorEnumDifference);
        }

        const packageTranspose = packageCv.emptyMat();
        packageCv.transpose(packageSource, packageTranspose);
        const cases = [
          ["flip", packageCv.flipAlloc(packageSource, 1)],
          ["transpose", packageTranspose],
          ["rotate", packageCv.rotateAlloc(packageSource, 0)],
          ["repeat", packageCv.repeatAlloc(packageSource, 2, 1)],
        ];

        for (const [operation, packageOutput] of cases) {
          sameBytes(packageOutput.toUint8Array(), referenceOutputs[operation], operation);
          packageOutput.dispose();
        }

        const packageContour = packageCv.matFromI32(
          4,
          1,
          2,
          new Int32Array([0, 0, 4, 0, 4, 3, 0, 3]),
        );
        sameNumbers(
          [packageCv.arcLength(packageContour, true)],
          [referenceOutputs.arcLength],
          "arcLength",
        );
        sameNumbers(
          [packageCv.contourArea(packageContour)],
          [referenceOutputs.contourArea],
          "contourArea",
        );
        const packageBounds = packageCv.boundingRect(packageContour);
        sameNumbers(
          [packageBounds.x, packageBounds.y, packageBounds.width, packageBounds.height],
          referenceOutputs.boundingRect,
          "boundingRect",
          0,
        );
        if (packageCv.isContourConvex(packageContour) !== referenceOutputs.isContourConvex) {
          throw new Error("isContourConvex differs from OpenCV.js");
        }
        sameNumbers(
          [packageCv.pointPolygonTest(packageContour, { x: 2, y: 1 }, true)],
          [referenceOutputs.pointPolygonTest],
          "pointPolygonTest",
        );
        packageContour.dispose();

        const packageKernel = packageCv.getStructuringElement(
          1,
          { width: 3, height: 3 },
          { x: 1, y: 1 },
        );
        sameBytes(
          packageKernel.toUint8Array(),
          referenceOutputs.getStructuringElement,
          "getStructuringElement",
        );
        packageKernel.dispose();

        const packageRotation = packageCv.getRotationMatrix2D({ x: 1, y: 2 }, 90, 1);
        sameNumbers(
          packageRotation.toFloat64Array(),
          referenceOutputs.getRotationMatrix2D,
          "getRotationMatrix2D",
        );
        packageRotation.dispose();

        sameNumbers(
          [
            packageCv.getOptimalDFTSize(7),
            packageCv.getOptimalDFTSize(25),
            packageCv.getOptimalDFTSize(0),
            packageCv.getOptimalDFTSize(-1),
            packageCv.getOptimalDFTSize(2_125_763_999),
            packageCv.getOptimalDFTSize(2_125_764_000),
          ],
          referenceOutputs.optimalDftSizes,
          "getOptimalDFTSize",
          0,
        );

        const optimalDftSizeDifference = findDifference(
          auditOptimalDftSize(packageCv),
          referenceOutputs.optimalDftSizeAudit,
          "getOptimalDFTSize audit",
        );
        if (optimalDftSizeDifference !== undefined) {
          throw new Error(optimalDftSizeDifference);
        }

        const packageAkaze = packageCv.createAKAZE();
        if (packageAkaze.getDefaultName() !== referenceOutputs.akazeDefaultName) {
          throw new Error(
            `AKAZE default name differs: package=${packageAkaze.getDefaultName()} OpenCV.js=${referenceOutputs.akazeDefaultName}`,
          );
        }
        sameNumbers(
          [
            packageAkaze.getDescriptorType()?.value,
            packageAkaze.getDescriptorSize(),
            packageAkaze.getDescriptorChannels(),
            packageAkaze.getThreshold(),
            packageAkaze.getNOctaves(),
            packageAkaze.getNOctaveLayers(),
            packageAkaze.getDiffusivity()?.value,
          ],
          referenceOutputs.akazeDefaults,
          "AKAZE defaults",
          1e-9,
        );
        packageAkaze.setDescriptorType(packageCv.AKAZE_DescriptorType.DESCRIPTOR_MLDB_UPRIGHT);
        packageAkaze.setDescriptorSize(96);
        packageAkaze.setDescriptorChannels(2);
        packageAkaze.setThreshold(0.05);
        packageAkaze.setNOctaves(5);
        packageAkaze.setNOctaveLayers(6);
        packageAkaze.setDiffusivity(packageCv.KAZE_DiffusivityType.DIFF_WEICKERT);
        sameNumbers(
          [
            packageAkaze.getDescriptorType()?.value,
            packageAkaze.getDescriptorSize(),
            packageAkaze.getDescriptorChannels(),
            packageAkaze.getThreshold(),
            packageAkaze.getNOctaves(),
            packageAkaze.getNOctaveLayers(),
            packageAkaze.getDiffusivity()?.value,
          ],
          referenceOutputs.akazeMutated,
          "AKAZE mutations",
          1e-7,
        );
        packageAkaze.dispose();

        const packageAkazeAudit = auditAkazePrimitive(() => packageCv.createAKAZE());
        const akazeDifference = findDifference(
          packageAkazeAudit,
          referenceOutputs.akazePrimitiveAudit,
          "AKAZE primitive audit",
        );
        if (akazeDifference !== undefined) {
          throw new Error(akazeDifference);
        }

        const packageAgast = packageCv.createAgastFeatureDetector();
        if (packageAgast.getDefaultName() !== referenceOutputs.agastDefaultName) {
          throw new Error(
            `AGAST default name differs: package=${packageAgast.getDefaultName()} OpenCV.js=${referenceOutputs.agastDefaultName}`,
          );
        }
        sameNumbers(
          [
            packageAgast.getNonmaxSuppression(),
            packageAgast.getThreshold(),
            packageAgast.getType()?.value,
          ],
          referenceOutputs.agastDefaults,
          "AGAST defaults",
          0,
        );
        packageAgast.setNonmaxSuppression(false);
        packageAgast.setThreshold(-1);
        packageAgast.setType(packageCv.AgastFeatureDetector_DetectorType.AGAST_5_8);
        sameNumbers(
          [
            packageAgast.getNonmaxSuppression(),
            packageAgast.getThreshold(),
            packageAgast.getType()?.value,
          ],
          referenceOutputs.agastMutated,
          "AGAST mutations",
          0,
        );
        packageAgast.dispose();

        const packageFast = packageCv.createFastFeatureDetector();
        if (packageFast.getDefaultName() !== referenceOutputs.fastDefaultName) {
          throw new Error(
            `FAST default name differs: package=${packageFast.getDefaultName()} OpenCV.js=${referenceOutputs.fastDefaultName}`,
          );
        }
        sameNumbers(
          [
            packageFast.getNonmaxSuppression(),
            packageFast.getThreshold(),
            packageFast.getType()?.value,
          ],
          referenceOutputs.fastDefaults,
          "FAST defaults",
          0,
        );
        packageFast.setNonmaxSuppression(false);
        packageFast.setThreshold(256);
        packageFast.setType(packageCv.FastFeatureDetector_DetectorType.TYPE_5_8);
        sameNumbers(
          [
            packageFast.getNonmaxSuppression(),
            packageFast.getThreshold(),
            packageFast.getType()?.value,
          ],
          referenceOutputs.fastMutated,
          "FAST mutations",
          0,
        );
        packageFast.dispose();

        const packageKaze = packageCv.createKAZE();
        if (packageKaze.getDefaultName() !== referenceOutputs.kazeDefaultName) {
          throw new Error(
            `KAZE default name differs: package=${packageKaze.getDefaultName()} OpenCV.js=${referenceOutputs.kazeDefaultName}`,
          );
        }
        sameNumbers(
          [
            packageKaze.getDiffusivity()?.value,
            packageKaze.getExtended(),
            packageKaze.getNOctaveLayers(),
            packageKaze.getNOctaves(),
            packageKaze.getThreshold(),
            packageKaze.getUpright(),
          ],
          referenceOutputs.kazeDefaults,
          "KAZE defaults",
          1e-9,
        );
        packageKaze.setDiffusivity(packageCv.KAZE_DiffusivityType.DIFF_WEICKERT);
        packageKaze.setExtended(true);
        packageKaze.setNOctaveLayers(6);
        packageKaze.setNOctaves(5);
        packageKaze.setThreshold(-1);
        packageKaze.setUpright(true);
        sameNumbers(
          [
            packageKaze.getDiffusivity()?.value,
            packageKaze.getExtended(),
            packageKaze.getNOctaveLayers(),
            packageKaze.getNOctaves(),
            packageKaze.getThreshold(),
            packageKaze.getUpright(),
          ],
          referenceOutputs.kazeMutated,
          "KAZE mutations",
          0,
        );
        packageKaze.dispose();

        const packageGftt = packageCv.createGFTTDetector();
        if (packageGftt.getDefaultName() !== referenceOutputs.gfttDefaultName) {
          throw new Error(
            `GFTT default name differs: package=${packageGftt.getDefaultName()} OpenCV.js=${referenceOutputs.gfttDefaultName}`,
          );
        }
        sameNumbers(
          [
            packageGftt.getBlockSize(),
            packageGftt.getHarrisDetector(),
            packageGftt.getK(),
            packageGftt.getMaxFeatures(),
            packageGftt.getMinDistance(),
            packageGftt.getQualityLevel(),
          ],
          referenceOutputs.gfttDefaults,
          "GFTT defaults",
          0,
        );
        packageGftt.setBlockSize(-1);
        packageGftt.setHarrisDetector(true);
        packageGftt.setK(-1);
        packageGftt.setMaxFeatures(-1);
        packageGftt.setMinDistance(-1);
        packageGftt.setQualityLevel(-1);
        sameNumbers(
          [
            packageGftt.getBlockSize(),
            packageGftt.getHarrisDetector(),
            packageGftt.getK(),
            packageGftt.getMaxFeatures(),
            packageGftt.getMinDistance(),
            packageGftt.getQualityLevel(),
          ],
          referenceOutputs.gfttMutated,
          "GFTT mutations",
          0,
        );
        packageGftt.setK(Number.NaN);
        packageGftt.setMinDistance(Number.NEGATIVE_INFINITY);
        packageGftt.setQualityLevel(Number.POSITIVE_INFINITY);
        sameNumbers(
          [
            Number.isNaN(packageGftt.getK()),
            packageGftt.getMinDistance() === Number.NEGATIVE_INFINITY,
            packageGftt.getQualityLevel() === Number.POSITIVE_INFINITY,
          ],
          referenceOutputs.gfttNonFinite,
          "GFTT non-finite values",
          0,
        );
        packageGftt.dispose();

        const packageGfttAudit = auditGftt(() => packageCv.createGFTTDetector());
        const gfttDifference = findDifference(packageGfttAudit, referenceOutputs.gfttAudit);
        if (gfttDifference !== undefined) {
          throw new Error(gfttDifference);
        }

        const packageKazeAudit = auditKazePrimitive(() => packageCv.createKAZE());
        const kazeDifference = findDifference(
          packageKazeAudit,
          referenceOutputs.kazePrimitiveAudit,
          "KAZE primitive audit",
        );
        if (kazeDifference !== undefined) {
          throw new Error(kazeDifference);
        }

        const thresholdAudits = [
          [
            "AGAST primitive audit",
            auditThresholdDetector(() => packageCv.createAgastFeatureDetector()),
            referenceOutputs.agastPrimitiveAudit,
          ],
          [
            "FAST primitive audit",
            auditThresholdDetector(() => packageCv.createFastFeatureDetector()),
            referenceOutputs.fastPrimitiveAudit,
          ],
        ];
        for (const [label, packageAudit, referenceAudit] of thresholdAudits) {
          const difference = findDifference(packageAudit, referenceAudit, label);
          if (difference !== undefined) {
            throw new Error(difference);
          }
        }

        packageSource.dispose();
        result.value =
          "PASS OpenCV.js 4.13.0 layout, geometry, helper, DFT, AKAZE, AGAST, FAST, KAZE, and GFTT differential";
        document.body.dataset.status = "passed";
      } catch (error) {
        result.value = `FAIL ${String(error)}`;
        document.body.dataset.status = "failed";
        throw error;
      }
    </script>
  </body>
</html>
