<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bun-opencv differential test</title>
    <script type="importmap">
      {
        "imports": {
          "#wasm": "/wasm/bun_opencv_wasm.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>bun-opencv differential test</h1>
      <output id="result">Running...</output>
    </main>
    <script type="module">
      import { initOpenCv } from "/dist/index.js";

      const result = document.querySelector("#result");
      if (!(result instanceof HTMLOutputElement)) {
        throw new Error("Differential output is missing");
      }

      function sameBytes(actual, expected, operation) {
        if (actual.length !== expected.length) {
          throw new Error(
            `${operation} length differs: package=${actual.length} OpenCV.js=${expected.length}`,
          );
        }
        for (let index = 0; index < actual.length; index += 1) {
          if (actual[index] !== expected[index]) {
            throw new Error(
              `${operation} differs at ${index}: package=${actual[index]} OpenCV.js=${expected[index]}`,
            );
          }
        }
      }

      function sameNumbers(actual, expected, operation, tolerance = 1e-12) {
        if (actual.length !== expected.length) {
          throw new Error(
            `${operation} length differs: package=${actual.length} OpenCV.js=${expected.length}`,
          );
        }
        for (let index = 0; index < actual.length; index += 1) {
          if (Math.abs(actual[index] - expected[index]) > tolerance) {
            throw new Error(
              `${operation} differs at ${index}: package=${actual[index]} OpenCV.js=${expected[index]}`,
            );
          }
        }
      }

      function runReference(input) {
        return new Promise((resolve, reject) => {
          const worker = new Worker("/test/browser/opencv-reference-worker.js");
          const timeout = setTimeout(() => {
            worker.terminate();
            reject(new Error("OpenCV.js worker timed out after 180 seconds"));
          }, 180000);
          worker.addEventListener("message", ({ data }) => {
            if (data.progress !== undefined) {
              result.value = data.progress;
              return;
            }
            clearTimeout(timeout);
            worker.terminate();
            if (data.error !== undefined) {
              reject(new Error(data.error));
              return;
            }
            resolve(data.outputs);
          });
          worker.addEventListener("error", ({ message }) => {
            clearTimeout(timeout);
            worker.terminate();
            reject(new Error(message));
          });
          worker.postMessage(input);
        });
      }

      try {
        const packageCv = await initOpenCv();
        const input = new Uint8Array([1, 2, 3, 4, 5, 6]);
        const packageSource = packageCv.matFromU8(2, 3, 1, input);
        const referenceOutputs = await runReference(input);

        const cases = [
          ["flip", packageCv.flip(packageSource, 1)],
          ["transpose", packageCv.transpose(packageSource)],
          ["rotate", packageCv.rotate(packageSource, 0)],
          ["repeat", packageCv.repeat(packageSource, 2, 1)],
        ];

        for (const [operation, packageOutput] of cases) {
          sameBytes(packageOutput.toUint8Array(), referenceOutputs[operation], operation);
          packageOutput.dispose();
        }

        const packageContour = packageCv.matFromI32(
          4,
          1,
          2,
          new Int32Array([0, 0, 4, 0, 4, 3, 0, 3]),
        );
        sameNumbers(
          [packageCv.arcLength(packageContour, true)],
          [referenceOutputs.arcLength],
          "arcLength",
        );
        sameNumbers(
          [packageCv.contourArea(packageContour)],
          [referenceOutputs.contourArea],
          "contourArea",
        );
        const packageBounds = packageCv.boundingRect(packageContour);
        sameNumbers(
          [packageBounds.x, packageBounds.y, packageBounds.width, packageBounds.height],
          referenceOutputs.boundingRect,
          "boundingRect",
          0,
        );
        if (packageCv.isContourConvex(packageContour) !== referenceOutputs.isContourConvex) {
          throw new Error("isContourConvex differs from OpenCV.js");
        }
        sameNumbers(
          [packageCv.pointPolygonTest(packageContour, { x: 2, y: 1 }, true)],
          [referenceOutputs.pointPolygonTest],
          "pointPolygonTest",
        );
        packageContour.dispose();

        const packageKernel = packageCv.getStructuringElement(
          1,
          { width: 3, height: 3 },
          { x: 1, y: 1 },
        );
        sameBytes(
          packageKernel.toUint8Array(),
          referenceOutputs.getStructuringElement,
          "getStructuringElement",
        );
        packageKernel.dispose();

        const packageRotation = packageCv.getRotationMatrix2D({ x: 1, y: 2 }, 90, 1);
        sameNumbers(
          packageRotation.toFloat64Array(),
          referenceOutputs.getRotationMatrix2D,
          "getRotationMatrix2D",
        );
        packageRotation.dispose();

        sameNumbers(
          [
            packageCv.getOptimalDFTSize(7),
            packageCv.getOptimalDFTSize(25),
            packageCv.getOptimalDFTSize(0),
          ],
          referenceOutputs.optimalDftSizes,
          "getOptimalDFTSize",
          0,
        );

        const packageAkaze = packageCv.createAKAZE();
        if (packageAkaze.getDefaultName() !== referenceOutputs.akazeDefaultName) {
          throw new Error(
            `AKAZE default name differs: package=${packageAkaze.getDefaultName()} OpenCV.js=${referenceOutputs.akazeDefaultName}`,
          );
        }
        sameNumbers(
          [
            packageAkaze.getDescriptorType(),
            packageAkaze.getDescriptorSize(),
            packageAkaze.getDescriptorChannels(),
            packageAkaze.getThreshold(),
            packageAkaze.getNOctaves(),
            packageAkaze.getNOctaveLayers(),
            packageAkaze.getDiffusivity(),
          ],
          referenceOutputs.akazeDefaults,
          "AKAZE defaults",
          1e-9,
        );
        packageAkaze.setDescriptorType(4);
        packageAkaze.setDescriptorSize(96);
        packageAkaze.setDescriptorChannels(2);
        packageAkaze.setThreshold(0.05);
        packageAkaze.setNOctaves(5);
        packageAkaze.setNOctaveLayers(6);
        packageAkaze.setDiffusivity(2);
        sameNumbers(
          [
            packageAkaze.getDescriptorType(),
            packageAkaze.getDescriptorSize(),
            packageAkaze.getDescriptorChannels(),
            packageAkaze.getThreshold(),
            packageAkaze.getNOctaves(),
            packageAkaze.getNOctaveLayers(),
            packageAkaze.getDiffusivity(),
          ],
          referenceOutputs.akazeMutated,
          "AKAZE mutations",
          1e-7,
        );
        packageAkaze.dispose();

        const packageAgast = packageCv.createAgastFeatureDetector();
        if (packageAgast.getDefaultName() !== referenceOutputs.agastDefaultName) {
          throw new Error(
            `AGAST default name differs: package=${packageAgast.getDefaultName()} OpenCV.js=${referenceOutputs.agastDefaultName}`,
          );
        }
        sameNumbers(
          [
            packageAgast.getNonmaxSuppression(),
            packageAgast.getThreshold(),
            packageAgast.getType(),
          ],
          referenceOutputs.agastDefaults,
          "AGAST defaults",
          0,
        );
        packageAgast.setNonmaxSuppression(false);
        packageAgast.setThreshold(-1);
        packageAgast.setType(0);
        sameNumbers(
          [
            packageAgast.getNonmaxSuppression(),
            packageAgast.getThreshold(),
            packageAgast.getType(),
          ],
          referenceOutputs.agastMutated,
          "AGAST mutations",
          0,
        );
        packageAgast.dispose();

        const packageFast = packageCv.createFastFeatureDetector();
        if (packageFast.getDefaultName() !== referenceOutputs.fastDefaultName) {
          throw new Error(
            `FAST default name differs: package=${packageFast.getDefaultName()} OpenCV.js=${referenceOutputs.fastDefaultName}`,
          );
        }
        sameNumbers(
          [packageFast.getNonmaxSuppression(), packageFast.getThreshold(), packageFast.getType()],
          referenceOutputs.fastDefaults,
          "FAST defaults",
          0,
        );
        packageFast.setNonmaxSuppression(false);
        packageFast.setThreshold(256);
        packageFast.setType(0);
        sameNumbers(
          [packageFast.getNonmaxSuppression(), packageFast.getThreshold(), packageFast.getType()],
          referenceOutputs.fastMutated,
          "FAST mutations",
          0,
        );
        packageFast.dispose();

        const packageKaze = packageCv.createKAZE();
        if (packageKaze.getDefaultName() !== referenceOutputs.kazeDefaultName) {
          throw new Error(
            `KAZE default name differs: package=${packageKaze.getDefaultName()} OpenCV.js=${referenceOutputs.kazeDefaultName}`,
          );
        }
        sameNumbers(
          [
            packageKaze.getDiffusivity(),
            packageKaze.getExtended(),
            packageKaze.getNOctaveLayers(),
            packageKaze.getNOctaves(),
            packageKaze.getThreshold(),
            packageKaze.getUpright(),
          ],
          referenceOutputs.kazeDefaults,
          "KAZE defaults",
          1e-9,
        );
        packageKaze.setDiffusivity(2);
        packageKaze.setExtended(true);
        packageKaze.setNOctaveLayers(6);
        packageKaze.setNOctaves(5);
        packageKaze.setThreshold(-1);
        packageKaze.setUpright(true);
        sameNumbers(
          [
            packageKaze.getDiffusivity(),
            packageKaze.getExtended(),
            packageKaze.getNOctaveLayers(),
            packageKaze.getNOctaves(),
            packageKaze.getThreshold(),
            packageKaze.getUpright(),
          ],
          referenceOutputs.kazeMutated,
          "KAZE mutations",
          0,
        );
        packageKaze.dispose();

        const packageGftt = packageCv.createGFTTDetector();
        if (packageGftt.getDefaultName() !== referenceOutputs.gfttDefaultName) {
          throw new Error(
            `GFTT default name differs: package=${packageGftt.getDefaultName()} OpenCV.js=${referenceOutputs.gfttDefaultName}`,
          );
        }
        sameNumbers(
          [
            packageGftt.getBlockSize(),
            packageGftt.getHarrisDetector(),
            packageGftt.getK(),
            packageGftt.getMaxFeatures(),
            packageGftt.getMinDistance(),
            packageGftt.getQualityLevel(),
          ],
          referenceOutputs.gfttDefaults,
          "GFTT defaults",
          0,
        );
        packageGftt.setBlockSize(-1);
        packageGftt.setHarrisDetector(true);
        packageGftt.setK(-1);
        packageGftt.setMaxFeatures(-1);
        packageGftt.setMinDistance(-1);
        packageGftt.setQualityLevel(-1);
        sameNumbers(
          [
            packageGftt.getBlockSize(),
            packageGftt.getHarrisDetector(),
            packageGftt.getK(),
            packageGftt.getMaxFeatures(),
            packageGftt.getMinDistance(),
            packageGftt.getQualityLevel(),
          ],
          referenceOutputs.gfttMutated,
          "GFTT mutations",
          0,
        );
        packageGftt.setK(Number.NaN);
        packageGftt.setMinDistance(Number.NEGATIVE_INFINITY);
        packageGftt.setQualityLevel(Number.POSITIVE_INFINITY);
        sameNumbers(
          [
            Number.isNaN(packageGftt.getK()),
            packageGftt.getMinDistance() === Number.NEGATIVE_INFINITY,
            packageGftt.getQualityLevel() === Number.POSITIVE_INFINITY,
          ],
          referenceOutputs.gfttNonFinite,
          "GFTT non-finite values",
          0,
        );
        packageGftt.dispose();

        packageSource.dispose();
        result.value =
          "PASS OpenCV.js 4.13.0 layout, geometry, helper, DFT, AKAZE, AGAST, FAST, KAZE, and GFTT differential";
        document.body.dataset.status = "passed";
      } catch (error) {
        result.value = `FAIL ${String(error)}`;
        document.body.dataset.status = "failed";
        throw error;
      }
    </script>
  </body>
</html>
