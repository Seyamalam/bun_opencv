<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bun-opencv differential test</title>
    <script type="importmap">
      {
        "imports": {
          "#wasm": "/wasm/bun_opencv_wasm.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>bun-opencv differential test</h1>
      <output id="result">Running...</output>
    </main>
    <script type="module">
      import { initOpenCv } from "/dist/index.js";

      const result = document.querySelector("#result");
      if (!(result instanceof HTMLOutputElement)) {
        throw new Error("Differential output is missing");
      }

      function sameBytes(actual, expected, operation) {
        if (actual.length !== expected.length) {
          throw new Error(
            `${operation} length differs: package=${actual.length} OpenCV.js=${expected.length}`,
          );
        }
        for (let index = 0; index < actual.length; index += 1) {
          if (actual[index] !== expected[index]) {
            throw new Error(
              `${operation} differs at ${index}: package=${actual[index]} OpenCV.js=${expected[index]}`,
            );
          }
        }
      }

      function sameNumbers(actual, expected, operation, tolerance = 1e-12) {
        if (actual.length !== expected.length) {
          throw new Error(
            `${operation} length differs: package=${actual.length} OpenCV.js=${expected.length}`,
          );
        }
        for (let index = 0; index < actual.length; index += 1) {
          if (Math.abs(actual[index] - expected[index]) > tolerance) {
            throw new Error(
              `${operation} differs at ${index}: package=${actual[index]} OpenCV.js=${expected[index]}`,
            );
          }
        }
      }

      function runReference(input) {
        return new Promise((resolve, reject) => {
          const worker = new Worker("/test/browser/opencv-reference-worker.js");
          const timeout = setTimeout(() => {
            worker.terminate();
            reject(new Error("OpenCV.js worker timed out after 180 seconds"));
          }, 180000);
          worker.addEventListener("message", ({ data }) => {
            if (data.progress !== undefined) {
              result.value = data.progress;
              return;
            }
            clearTimeout(timeout);
            worker.terminate();
            if (data.error !== undefined) {
              reject(new Error(data.error));
              return;
            }
            resolve(data.outputs);
          });
          worker.addEventListener("error", ({ message }) => {
            clearTimeout(timeout);
            worker.terminate();
            reject(new Error(message));
          });
          worker.postMessage(input);
        });
      }

      try {
        const packageCv = await initOpenCv();
        const input = new Uint8Array([1, 2, 3, 4, 5, 6]);
        const packageSource = packageCv.matFromU8(2, 3, 1, input);
        const referenceOutputs = await runReference(input);

        const cases = [
          ["flip", packageCv.flip(packageSource, 1)],
          ["transpose", packageCv.transpose(packageSource)],
          ["rotate", packageCv.rotate(packageSource, 0)],
          ["repeat", packageCv.repeat(packageSource, 2, 1)],
        ];

        for (const [operation, packageOutput] of cases) {
          sameBytes(packageOutput.toUint8Array(), referenceOutputs[operation], operation);
          packageOutput.dispose();
        }

        const packageContour = packageCv.matFromI32(
          4,
          1,
          2,
          new Int32Array([0, 0, 4, 0, 4, 3, 0, 3]),
        );
        sameNumbers(
          [packageCv.arcLength(packageContour, true)],
          [referenceOutputs.arcLength],
          "arcLength",
        );
        sameNumbers(
          [packageCv.contourArea(packageContour)],
          [referenceOutputs.contourArea],
          "contourArea",
        );
        const packageBounds = packageCv.boundingRect(packageContour);
        sameNumbers(
          [packageBounds.x, packageBounds.y, packageBounds.width, packageBounds.height],
          referenceOutputs.boundingRect,
          "boundingRect",
          0,
        );
        if (packageCv.isContourConvex(packageContour) !== referenceOutputs.isContourConvex) {
          throw new Error("isContourConvex differs from OpenCV.js");
        }
        sameNumbers(
          [packageCv.pointPolygonTest(packageContour, { x: 2, y: 1 }, true)],
          [referenceOutputs.pointPolygonTest],
          "pointPolygonTest",
        );
        packageContour.dispose();

        const packageKernel = packageCv.getStructuringElement(
          1,
          { width: 3, height: 3 },
          { x: 1, y: 1 },
        );
        sameBytes(
          packageKernel.toUint8Array(),
          referenceOutputs.getStructuringElement,
          "getStructuringElement",
        );
        packageKernel.dispose();

        const packageRotation = packageCv.getRotationMatrix2D({ x: 1, y: 2 }, 90, 1);
        sameNumbers(
          packageRotation.toFloat64Array(),
          referenceOutputs.getRotationMatrix2D,
          "getRotationMatrix2D",
        );
        packageRotation.dispose();

        packageSource.dispose();
        result.value = "PASS OpenCV.js 4.13.0 layout, geometry, and helper differential";
        document.body.dataset.status = "passed";
      } catch (error) {
        result.value = `FAIL ${String(error)}`;
        document.body.dataset.status = "failed";
        throw error;
      }
    </script>
  </body>
</html>
