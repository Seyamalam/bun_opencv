name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and bundler
      placeholder: Firefox 143 and Vite 7
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include image dimensions, relevant RGBA bytes or a non-sensitive fixture, and code.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: The report contains no private images, credentials, or personal data.
          required: true
